[project]
name = "backroom-bench"
version = "0.1.0"
description = "Benchmark harness (B1-B5) and LLM provider capability probe."
requires-python = ">=3.12"
dependencies = ["backroom-api"]

[project.scripts]
backroom-bench = "backroom_bench.cli:main"

[tool.uv.sources]
backroom-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backroom_bench"]
