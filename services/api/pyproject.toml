[project]
name = "backroom-api"
version = "0.1.0"
description = "Backroom API: orchestrator, agents, memory, LLM layer."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "anthropic>=1.0",
    "httpx>=0.27",
    "playwright>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backroom_api"]
