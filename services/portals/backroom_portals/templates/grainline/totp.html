{% extends "grainline/base.html" %}
{% block title %}Two-step verification · Grainline Wholesale{% endblock %}
{% block body %}
<main>
  <h1>Two-step verification</h1>
  <form class="box" method="post" action="/grainline/login/totp" data-testid="{{ tid('totp_form') }}">
    <p class="muted">Enter the 6-digit code from your authenticator app.</p>
    {% if error %}<p class="error" role="alert" data-testid="{{ tid('totp_error') }}">That code is not valid. Try again.</p>{% endif %}
    <label for="code">{{ t('totp_code') }}</label>
    <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" required data-testid="{{ tid('totp_code') }}">
    <p><button type="submit" data-testid="{{ tid('verify') }}">{{ t('verify') }}</button></p>
  </form>
</main>
{% endblock %}
