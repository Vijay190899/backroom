[project]
name = "backroom-portals"
version = "0.1.0"
description = "Mock merchant portals (Grainline, TillDesk, Localboard) with a seeded chaos engine."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backroom_portals"]
