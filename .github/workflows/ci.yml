name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs & config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON config
        run: python -m json.tool .mcp.json > /dev/null
      - name: Check relative links in Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path graphify-out --exclude-path node_modules './*.md' './docs/**/*.md'
          fail: true

  python:
    name: Python (ruff · pyright · pytest)
    runs-on: ubuntu-latest
    # Postgres with pgvector, so the memory, brief and API tests run instead of skipping.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: backroom
          POSTGRES_PASSWORD: backroom
          POSTGRES_DB: backroom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U backroom"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://backroom:backroom@localhost:5432/backroom
    steps:
      - uses: actions/checkout@v4
      - name: Detect Python workspace
        id: detect
        run: |
          if [ -f pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No pyproject.toml yet; skipping (activates at M0)."; fi
      - if: steps.detect.outputs.present == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.detect.outputs.present == 'true'
        run: uv sync --all-packages
      - if: steps.detect.outputs.present == 'true'
        run: uv run ruff check .
      - if: steps.detect.outputs.present == 'true'
        run: uv run pyright
      - if: steps.detect.outputs.present == 'true'
        name: Install Chromium (the browser-agent tests skip without it)
        run: uv run playwright install --with-deps chromium chromium-headless-shell
      - if: steps.detect.outputs.present == 'true'
        run: uv run pytest -q -rs

  web:
    name: Web (lint · typecheck · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect web app
        id: detect
        run: |
          if [ -f apps/web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No apps/web yet; skipping (activates at M0)."; fi
      - if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        run: pnpm -C apps/web lint
      - if: steps.detect.outputs.present == 'true'
        run: pnpm -C apps/web typecheck
      - if: steps.detect.outputs.present == 'true'
        run: pnpm -C apps/web contracts
      - if: steps.detect.outputs.present == 'true'
        run: pnpm -C apps/web build
