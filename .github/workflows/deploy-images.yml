# Builds the api and portals images and pushes them to GHCR, so the 2 GB Lightsail box
# only pulls (HANDOVER §9 L12). Pull requests build without pushing, to prove the images.
name: Deploy images

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "data/**"
      - "bench/**"
      - "infra/Dockerfile.*"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".dockerignore"
      - ".github/workflows/deploy-images.yml"
  pull_request:
    paths:
      - "services/**"
      - "data/**"
      - "bench/**"
      - "infra/Dockerfile.*"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".dockerignore"
      - ".github/workflows/deploy-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, portals]
    steps:
      - uses: actions/checkout@v4

      # GHCR names must be lower case; the owner is "Vijay190899".
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/backroom-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.${{ matrix.service }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
