[project]
name = "backroom-data"
version = "0.1.0"
description = "Open-data pipeline for the Hafer & Bohne demo world."
requires-python = ">=3.12"
dependencies = [
    "backroom-portals",
    "duckdb>=2.0,<3",
    "pyyaml>=6",
]

[project.scripts]
backroom-data = "backroom_data.cli:main"

[tool.uv.sources]
backroom-portals = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backroom_data"]
