[project]
name = "backroom"
version = "0.1.0"
description = "Agentic back office for local cafes: self-healing browser skills, temporal business memory, measured benchmarks."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api", "services/portals", "data", "bench"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps", "graphify-out", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["backroom_api", "backroom_portals", "backroom_data", "backroom_bench"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["services", "data", "bench"]
exclude = ["**/node_modules", "**/.venv", "apps", "graphify-out"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "services/portals/tests", "data/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --import-mode=importlib"
